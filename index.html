<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记账助手" />
    <meta name="description" content="本地优先、支持成员统计和 Gitee 私有仓库同步的家庭记账工具" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/app-icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>记账助手</title>
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="side-rail" aria-label="主导航">
        <div class="brand-mark" aria-label="记账助手">
          <span class="brand-logo">¥</span>
          <span class="brand-name">记账助手</span>
        </div>
        <nav id="desktop-nav" class="desktop-nav"></nav>
        <div id="sync-chip" class="sync-chip" role="status"></div>
      </aside>

      <main class="page-shell">
        <header class="topbar">
          <div>
            <p id="page-eyebrow" class="eyebrow"></p>
            <h1 id="page-title">首页</h1>
          </div>
          <button id="top-sync-button" class="icon-button" type="button" title="立即同步" aria-label="立即同步">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7h-5V2M4 17h5v5M5.1 9A8 8 0 0 1 18 5.2L20 7M4 17l2-2A8 8 0 0 0 18.9 15" /></svg>
          </button>
        </header>

        <div id="page-content" class="page-content" aria-live="polite"></div>
      </main>

      <nav id="mobile-nav" class="mobile-nav" aria-label="主导航"></nav>
    </div>

    <div id="sheet-root"></div>
    <div id="dialog-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <input id="json-import" type="file" accept="application/json,.json" hidden />

    <script src="./app.js" defer></script>
  </body>
</html>
